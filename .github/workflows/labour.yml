name: Run Labour Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

jobs:
  run-labour-cjs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Set up Google credentials
        run: echo "${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}" | base64 --decode > nrega-scraper.json

      - name: Run labour.cjs
        run: node labour.cjs
